name: Release Docker

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish to the MCP Registry
        required: true
        type: string

env:
  IMAGE_NAME: docker.io/zenmldocker/mcp-zenml
  MCP_PUBLISHER_VERSION: "1.8.1"
  MCP_PUBLISHER_LINUX_AMD64_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

permissions:
  contents: write

jobs:
  docker:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    environment: docker
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: ""

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Verify Docker package and MCP discovery
        run: |
          docker build -t mcp-zenml:release-test .
          uv run scripts/test_distributions.py docker mcp-zenml:release-test
          docker buildx build --platform linux/arm64 --load -t mcp-zenml:release-arm64 .
          uv run scripts/test_distributions.py docker mcp-zenml:release-arm64 --timeout 300

      - name: Verify committed and generated MCP bundles
        run: uv run scripts/test_distributions.py reproducible mcp-zenml.mcpb

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=ZenML MCP Server
            org.opencontainers.image.description=Model Context Protocol server for ZenML
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            io.modelcontextprotocol.server.name=io.github.zenml-io/mcp-zenml

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install MCP Publisher
        run: |
          ARCHIVE="${RUNNER_TEMP}/mcp-publisher.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            --output "${ARCHIVE}"
          echo "${MCP_PUBLISHER_LINUX_AMD64_SHA256}  ${ARCHIVE}" | sha256sum --check
          tar -xzf "${ARCHIVE}" mcp-publisher
          chmod +x mcp-publisher

      - name: Login to MCP Registry (OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish

      - name: Create/Update GitHub Release (attach MCP bundle)
        run: |
          # Try to create a new release; if it already exists (created by
          # release.yml), fall back to uploading the bundle to the existing one.
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            mcp-zenml.mcpb 2>/dev/null || \
          gh release upload "${TAG}" mcp-zenml.mcpb --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}

  registry-recovery:
    name: Publish existing release to MCP Registry
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: docker
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "release_tag must be an exact SemVer tag such as v2.0.0" >&2
            exit 1
          fi

      - name: Checkout current release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify released version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          EXPECTED_VERSION="${RELEASE_TAG#v}"
          ACTUAL_VERSION="$(tr -d '\n\r' < VERSION)"
          if [ "${ACTUAL_VERSION}" != "${EXPECTED_VERSION}" ]; then
            echo "Current release metadata has VERSION=${ACTUAL_VERSION}, expected ${EXPECTED_VERSION}" >&2
            exit 1
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release tag ${RELEASE_TAG} does not exist" >&2
            exit 1
          fi

      - name: Install MCP Publisher
        run: |
          ARCHIVE="${RUNNER_TEMP}/mcp-publisher.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            --output "${ARCHIVE}"
          echo "${MCP_PUBLISHER_LINUX_AMD64_SHA256}  ${ARCHIVE}" | sha256sum --check
          tar -xzf "${ARCHIVE}" mcp-publisher
          chmod +x mcp-publisher

      - name: Login to MCP Registry (OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
