name: PR Tests

on:
  pull_request:
    branches: [main]
    paths-ignore: ["assets/**"]
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual triggering
concurrency:
  # New commit on branch cancels running workflows of the same branch
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runner-tls:
    name: Runner TLS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    steps:
      # Temporary mitigation for actions/runner-images#15228, before Git checkout.
      - name: Repair macOS trust and verify preinstalled TLS clients
        if: runner.os == 'macOS'
        shell: bash
        run: |
          /usr/bin/python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import re
          import ssl
          import subprocess
          import tempfile
          import urllib.error
          import urllib.request

          # Only the roots needed to block the direct and AAA cross-signed chains.
          # https://emudhra.we-have-a-problem.com/roots.json
          blocked = {
              "86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b",
              "d7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4",
          }
          bundles = {Path("/etc/ssl/cert.pem")}
          for prefix in (Path("/opt/homebrew/etc"), Path("/usr/local/etc")):
              bundles.update(prefix.glob("openssl*/cert.pem"))
              bundle = prefix / "ca-certificates/cert.pem"
              if bundle.exists():
                  bundles.add(bundle)
          for bundle in {path.resolve(strict=True) for path in bundles}:
              certs = re.findall(r"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", bundle.read_text(), re.S)
              retained = [cert for cert in certs if hashlib.sha256(ssl.PEM_cert_to_DER_cert(cert)).hexdigest() not in blocked]
              if not retained:
                  raise RuntimeError(f"Refusing to install an empty CA bundle: {bundle}")
              if len(retained) != len(certs):
                  with tempfile.NamedTemporaryFile(mode="w") as temporary:
                      temporary.write("\n".join(retained) + "\n")
                      temporary.flush()
                      ssl.create_default_context(cafile=temporary.name)
                      subprocess.run(["sudo", "/usr/bin/install", "-m", "0644", "-o", "root", "-g", "wheel", temporary.name, str(bundle)], check=True)
              print(f"Filtered {len(certs) - len(retained)} compromised roots from {bundle}")

          # Route clients with independent defaults to the repaired bundle too.
          empty_directory = Path(os.environ["RUNNER_TEMP"]) / "empty-ca-directory"
          empty_directory.mkdir(exist_ok=True)
          overrides = dict.fromkeys(("SSL_CERT_FILE", "CURL_CA_BUNDLE", "GIT_SSL_CAINFO", "PIP_CERT", "REQUESTS_CA_BUNDLE"), "/etc/ssl/cert.pem")
          overrides["SSL_CERT_DIR"] = str(empty_directory)
          # Apple LibreSSL can retry missing issuers against Keychain trust.
          # https://github.com/galadran/we-have-a-problem.com/issues/65
          overrides["OPENSSL_X509_TEA_DISABLE"] = "1"
          os.environ.update(overrides)
          with open(os.environ["GITHUB_ENV"], "a") as environment:
              environment.writelines(f"{key}={value}\n" for key, value in overrides.items())

          subprocess.run(["git", "--version", "--build-options"], check=True)
          git_exec_path = subprocess.run(["git", "--exec-path"], check=True, capture_output=True, text=True).stdout.strip()
          git_https_helper = Path(git_exec_path) / "git-remote-https"
          print(f"Git HTTPS helper: {git_https_helper}", flush=True)
          subprocess.run(["/usr/bin/otool", "-L", str(git_https_helper)], check=True)
          print(f"Git CA bundle: {overrides['GIT_SSL_CAINFO']}; Apple Keychain fallback disabled", flush=True)

          bad_urls = ("https://dv-g3b-emudhra.we-have-a-problem.com/", "https://dv-g3b-aaa-emudhra.we-have-a-problem.com/")
          for client, command, healthy in (
              ("curl", ["curl", "--disable", "--silent", "--show-error", "--fail", "--connect-timeout", "10", "--max-time", "30", "--output", os.devnull], "https://pypi.org/simple/certifi/"),
              ("git", ["git", "-c", "credential.helper=", "-c", "http.extraHeader=", "ls-remote"], "https://github.com/curl/curl.git"),
          ):
              env = {key: os.environ[key] for key in ("PATH", "SSL_CERT_FILE", "SSL_CERT_DIR", "CURL_CA_BUNDLE", "GIT_SSL_CAINFO", "OPENSSL_X509_TEA_DISABLE") if key in os.environ}
              env.update(HOME=tempfile.mkdtemp(dir=os.environ["RUNNER_TEMP"]), LC_ALL="C", GIT_CONFIG_NOSYSTEM="1", GIT_CONFIG_GLOBAL=os.devnull, GIT_TERMINAL_PROMPT="0")
              subprocess.run([*command, healthy], env=env, check=True, capture_output=True, timeout=45)
              for url in bad_urls:
                  result = subprocess.run([*command, url], env=env, capture_output=True, text=True, timeout=45)
                  certificate_error = result.returncode == 60 if client == "curl" else any(message in result.stderr.lower() for message in ("certificate verify failed", "certificate verification failed", "ssl certificate problem"))
                  if result.returncode == 0 or not certificate_error or re.search(r"expired|not.?yet.?valid|not.?valid.?yet|not.?valid.?for.?name|hostname|does not match|no alternative certificate subject name|certificate subject name", result.stderr.lower()):
                      raise RuntimeError(f"{client} did not reject the compromised certificate (exit {result.returncode}): {result.stderr[-1500:]}")
              print(f"PASS: pre-checkout {client} rejects both compromised chains")

          # Apple's Python can ignore SSL_CERT_FILE, so test its actual default context.
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          with opener.open("https://pypi.org/simple/certifi/", timeout=30) as response:
              if response.status != 200:
                  raise RuntimeError("System Python healthy HTTPS control failed")
          for url in bad_urls:
              try:
                  with opener.open(url, timeout=30):
                      pass
              except urllib.error.URLError as error:
                  if isinstance(error.reason, ssl.SSLCertVerificationError) and error.reason.verify_code in (19, 20, 21, 23, 27, 28):
                      continue
                  raise
              raise RuntimeError(f"System Python accepted a compromised certificate: {url}")
          print("PASS: pre-checkout system Python rejects both compromised chains")
          PY

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install patched uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Test TLS gate failure classification
        run: python scripts/test_runner_tls.py
      - name: Verify selected Python and uv reject compromised certificates
        run: python scripts/check_runner_tls.py --repair-linux-trust

  disposable-integration:
    name: Disposable OSS ZenML integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ZENML_DISABLE_RICH_LOGGING: "1"
      ZENML_LOGGING_COLORS_DISABLED: "true"
      ZENML_ANALYTICS_OPT_IN: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: false

      - name: Verify runner TLS before installing dependencies
        run: python3 scripts/check_runner_tls.py --repair-linux-trust

      - name: Run disposable OSS integration receipt
        run: bash scripts/run_disposable_resource_integration.sh

  test:
    runs-on: ubuntu-latest
    environment: ci

    env:
      ZENML_DISABLE_RICH_LOGGING: "1"
      ZENML_LOGGING_COLORS_DISABLED: "true"
      ZENML_ANALYTICS_OPT_IN: "false"
      ZENML_MCP_ANALYTICS_TEST_RUN: "true"
      PYTHONIOENCODING: "UTF-8"
      PYTHONUNBUFFERED: "1"
      HAS_ZENML_CREDENTIALS: ${{ secrets.ZENML_STORE_URL != '' && secrets.ZENML_STORE_API_KEY != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Verify runner TLS before installing dependencies
        run: python3 scripts/check_runner_tls.py --repair-linux-trust

      - name: Check PEP 723 dependency drift
        run: python scripts/check_pep723_requirements.py

      - name: Install Apps browser
        run: uv run --with playwright==1.64.0 playwright install --with-deps chromium

      # Runs from the repo root, so uv applies the cooldown and its exemptions
      # from [tool.uv] in pyproject.toml.
      - name: Verify hashed requirements
        run: |
          uv venv --python 3.12 "${RUNNER_TEMP}/requirements-hash-check"
          source "${RUNNER_TEMP}/requirements-hash-check/bin/activate"
          uv pip install --dry-run --require-hashes -r requirements.txt

      - name: Run MCP smoke test
        if: env.HAS_ZENML_CREDENTIALS == 'true'
        env:
          ZENML_STORE_URL: ${{ secrets.ZENML_STORE_URL }}
          ZENML_STORE_API_KEY: ${{ secrets.ZENML_STORE_API_KEY }}
          ZENML_ACTIVE_PROJECT_ID: ${{ secrets.ZENML_ACTIVE_PROJECT_ID }}
        run: |
          echo "Running MCP smoke test..."
          uv run scripts/test_mcp_server.py server/zenml_server.py --profile compact --write-policy read_write

      - name: Skip MCP smoke test (no credentials)
        if: env.HAS_ZENML_CREDENTIALS != 'true'
        run: echo "⚠️ Skipping MCP smoke test — ZenML credentials not available (expected for Dependabot PRs)"

      - name: Run analytics pipeline test
        run: |
          echo "Running analytics pipeline test..."
          uv run scripts/test_analytics.py --full-diagnostic

      - name: Run unit tests (no credentials needed)
        run: |
          echo "Running datetime normalization, resource, SDK, MCP contract, and transport tests..."
          uv run scripts/test_datetime_normalization.py
          uv run scripts/test_resource_registry.py
          uv run scripts/test_resource_operations.py
          uv run scripts/test_resource_mutations.py
          uv run scripts/test_resource_actions.py
          uv run scripts/test_resource_integration.py
          uv run scripts/test_sdk_contracts.py
          uv run scripts/test_credential_isolation.py
          uv run scripts/test_tool_contracts.py
          uv run scripts/test_step_logs.py
          uv run scripts/test_mcp_transport.py
          uv run scripts/test_tool_profiles.py
          uv run scripts/test_mcp_apps.py
          uv run scripts/test_distributions.py self-test
          uv run scripts/generate_manifest_fields.py --check

      - name: Build and verify MCP bundle
        run: uv run scripts/test_distributions.py reproducible mcp-zenml.mcpb

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Verify runner TLS before installing dependencies
        run: python3 scripts/check_runner_tls.py --repair-linux-trust

      - name: Build Docker image
        run: |
          echo "Building Docker image to verify Dockerfile..."
          docker build -t mcp-zenml:test .

      - name: Verify Docker package and MCP discovery
        run: uv run scripts/test_distributions.py docker mcp-zenml:test

  type-check:
    name: Type Checking
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Verify runner TLS before installing dependencies
        run: python3 scripts/check_runner_tls.py --repair-linux-trust

      - name: Run ty type checker
        run: |
          echo "Running ty type checker..."
          uvx --constraints requirements-dev.txt ty check --output-format=github
