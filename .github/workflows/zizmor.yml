name: GitHub Actions Security Analysis

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/zizmor.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/zizmor.yml"
  # Weekly safety net to catch drift (runs Monday 3am UTC)
  schedule:
    - cron: "0 3 * * 1"
  # Allow manual triggering
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: Scan workflows with zizmor
    runs-on: ubuntu-latest
    # Only run on the main repo, not forks (scheduled runs would fail on forks)
    if: github.repository == 'zenml-io/mcp-zenml'
    permissions:
      contents: read
      actions: read
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          version: "0.8.15"

      - name: Run zizmor
        run: uvx zizmor==1.25.2 --format=github --config=.github/zizmor.yml .github/workflows/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
