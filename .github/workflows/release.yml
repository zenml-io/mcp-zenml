name: Release Orchestrator

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer to release (optional). If omitted, read from VERSION"
        required: false
        type: string
      prerelease:
        description: "Mark this as a prerelease"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Validate and build without commits, tags, releases, or publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # Run tests first as a gate before releasing
  test-gate:
    name: Pre-release Tests
    runs-on: ubuntu-latest
    environment: ci
    permissions:
      contents: read
    env:
      ZENML_DISABLE_RICH_LOGGING: "1"
      ZENML_LOGGING_COLORS_DISABLED: "true"
      ZENML_ANALYTICS_OPT_IN: "false"
      PYTHONIOENCODING: "UTF-8"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Verify runner TLS before installing dependencies
        run: python3 scripts/check_runner_tls.py --repair-linux-trust

      - name: Set up Node.js 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: ""

      - name: Check dependency and manifest consistency
        run: |
          python scripts/check_pep723_requirements.py
          uv run scripts/generate_manifest_fields.py --check

      - name: Run credential-free MCP contract tests
        run: |
          uv run scripts/test_credential_isolation.py
          uv run scripts/test_tool_profiles.py
          uv run scripts/test_mcp_transport.py
          uv run scripts/test_distributions.py self-test

      - name: Run authenticated MCP smoke test
        env:
          ZENML_STORE_URL: ${{ secrets.ZENML_STORE_URL }}
          ZENML_STORE_API_KEY: ${{ secrets.ZENML_STORE_API_KEY }}
          ZENML_ACTIVE_PROJECT_ID: ${{ secrets.ZENML_ACTIVE_PROJECT_ID }}
        run: |
          uv run scripts/test_mcp_server.py server/zenml_server.py --profile compact --write-policy read_write

      - name: Build and verify Docker image
        run: |
          docker build -t mcp-zenml:test .
          uv run scripts/test_distributions.py docker mcp-zenml:test

      - name: Build and verify MCP bundle
        run: uv run scripts/test_distributions.py reproducible mcp-zenml.mcpb

  live-integration:
    name: Disposable OSS ZenML integration receipt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ZENML_DISABLE_RICH_LOGGING: "1"
      ZENML_LOGGING_COLORS_DISABLED: "true"
      ZENML_ANALYTICS_OPT_IN: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: false

      - name: Verify runner TLS before installing dependencies
        run: python3 scripts/check_runner_tls.py --repair-linux-trust

      - name: Run disposable OSS integration receipt
        run: bash scripts/run_disposable_resource_integration.sh

  prepare-candidate:
    name: Prepare release candidate
    runs-on: ubuntu-latest
    needs: [test-gate, live-integration]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: false

      - name: Verify runner TLS before installing dependencies
        run: python3 scripts/check_runner_tls.py --repair-linux-trust

      - name: Set up Node.js 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: ""

      - name: Apply candidate version and build bundle
        env:
          INPUTS_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${INPUTS_VERSION}" ]; then
            python scripts/bump_version.py --version "${INPUTS_VERSION}"
          else
            python scripts/bump_version.py
          fi
          python scripts/generate_manifest_fields.py
          bash scripts/build_mcpb.sh
          BUNDLE_DIR="${RUNNER_TEMP}/mcp-zenml-release-bundle"
          mkdir -p "${BUNDLE_DIR}"
          uv run scripts/test_distributions.py inspect mcp-zenml.mcpb --extract-to "${BUNDLE_DIR}"
          uv run scripts/test_distributions.py unpacked "${BUNDLE_DIR}"

      - name: Upload exact release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-zenml-release-candidate
          path: |
            VERSION
            manifest.json
            server.json
            pyproject.toml
            mcpb-uv.lock
            mcp-zenml.mcpb
          if-no-files-found: error
          retention-days: 7

  bundle-compatibility:
    name: MCPB (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    needs: prepare-candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
      ZENML_MCP_ANALYTICS_ENABLED: "false"
    steps:
      # Temporary mitigation for actions/runner-images#15228, before Git checkout.
      - name: Repair macOS trust and verify preinstalled TLS clients
        if: runner.os == 'macOS'
        shell: bash
        run: |
          /usr/bin/python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import re
          import ssl
          import subprocess
          import tempfile
          import urllib.error
          import urllib.request

          # Only the roots needed to block the direct and AAA cross-signed chains.
          # https://emudhra.we-have-a-problem.com/roots.json
          blocked = {
              "86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b",
              "d7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4",
          }
          bundles = {Path("/etc/ssl/cert.pem")}
          for prefix in (Path("/opt/homebrew/etc"), Path("/usr/local/etc")):
              bundles.update(prefix.glob("openssl*/cert.pem"))
              bundle = prefix / "ca-certificates/cert.pem"
              if bundle.exists():
                  bundles.add(bundle)
          for bundle in {path.resolve(strict=True) for path in bundles}:
              certs = re.findall(r"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", bundle.read_text(), re.S)
              retained = [cert for cert in certs if hashlib.sha256(ssl.PEM_cert_to_DER_cert(cert)).hexdigest() not in blocked]
              if not retained:
                  raise RuntimeError(f"Refusing to install an empty CA bundle: {bundle}")
              if len(retained) != len(certs):
                  with tempfile.NamedTemporaryFile(mode="w") as temporary:
                      temporary.write("\n".join(retained) + "\n")
                      temporary.flush()
                      ssl.create_default_context(cafile=temporary.name)
                      subprocess.run(["sudo", "/usr/bin/install", "-m", "0644", "-o", "root", "-g", "wheel", temporary.name, str(bundle)], check=True)
              print(f"Filtered {len(certs) - len(retained)} compromised roots from {bundle}")

          # Route clients with independent defaults to the repaired bundle too.
          empty_directory = Path(os.environ["RUNNER_TEMP"]) / "empty-ca-directory"
          empty_directory.mkdir(exist_ok=True)
          overrides = dict.fromkeys(("SSL_CERT_FILE", "CURL_CA_BUNDLE", "GIT_SSL_CAINFO", "PIP_CERT", "REQUESTS_CA_BUNDLE"), "/etc/ssl/cert.pem")
          overrides["SSL_CERT_DIR"] = str(empty_directory)
          # Apple LibreSSL can retry missing issuers against Keychain trust.
          # https://github.com/galadran/we-have-a-problem.com/issues/65
          overrides["OPENSSL_X509_TEA_DISABLE"] = "1"
          os.environ.update(overrides)
          with open(os.environ["GITHUB_ENV"], "a") as environment:
              environment.writelines(f"{key}={value}\n" for key, value in overrides.items())

          subprocess.run(["git", "--version", "--build-options"], check=True)
          git_exec_path = subprocess.run(["git", "--exec-path"], check=True, capture_output=True, text=True).stdout.strip()
          git_https_helper = Path(git_exec_path) / "git-remote-https"
          print(f"Git HTTPS helper: {git_https_helper}", flush=True)
          subprocess.run(["/usr/bin/otool", "-L", str(git_https_helper)], check=True)
          print(f"Git CA bundle: {overrides['GIT_SSL_CAINFO']}; Apple Keychain fallback disabled", flush=True)

          bad_urls = ("https://dv-g3b-emudhra.we-have-a-problem.com/", "https://dv-g3b-aaa-emudhra.we-have-a-problem.com/")
          for client, command, healthy in (
              ("curl", ["curl", "--disable", "--silent", "--show-error", "--fail", "--connect-timeout", "10", "--max-time", "30", "--output", os.devnull], "https://pypi.org/simple/certifi/"),
              ("git", ["git", "-c", "credential.helper=", "-c", "http.extraHeader=", "ls-remote"], "https://github.com/curl/curl.git"),
          ):
              env = {key: os.environ[key] for key in ("PATH", "SSL_CERT_FILE", "SSL_CERT_DIR", "CURL_CA_BUNDLE", "GIT_SSL_CAINFO", "OPENSSL_X509_TEA_DISABLE") if key in os.environ}
              env.update(HOME=tempfile.mkdtemp(dir=os.environ["RUNNER_TEMP"]), LC_ALL="C", GIT_CONFIG_NOSYSTEM="1", GIT_CONFIG_GLOBAL=os.devnull, GIT_TERMINAL_PROMPT="0")
              subprocess.run([*command, healthy], env=env, check=True, capture_output=True, timeout=45)
              for url in bad_urls:
                  result = subprocess.run([*command, url], env=env, capture_output=True, text=True, timeout=45)
                  certificate_error = result.returncode == 60 if client == "curl" else any(message in result.stderr.lower() for message in ("certificate verify failed", "certificate verification failed", "ssl certificate problem", "ssl certificate openssl verify result: unable to get local issuer certificate (20)"))
                  if result.returncode == 0 or not certificate_error or re.search(r"expired|not.?yet.?valid|not.?valid.?yet|not.?valid.?for.?name|hostname|does not match|no alternative certificate subject name|certificate subject name", result.stderr.lower()):
                      raise RuntimeError(f"{client} did not reject the compromised certificate (exit {result.returncode}): {result.stderr[-1500:]}")
              print(f"PASS: pre-checkout {client} rejects both compromised chains")

          # Apple's Python can ignore SSL_CERT_FILE, so test its actual default context.
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          with opener.open("https://pypi.org/simple/certifi/", timeout=30) as response:
              if response.status != 200:
                  raise RuntimeError("System Python healthy HTTPS control failed")
          for url in bad_urls:
              try:
                  with opener.open(url, timeout=30):
                      pass
              except urllib.error.URLError as error:
                  if isinstance(error.reason, ssl.SSLCertVerificationError) and error.reason.verify_code in (19, 20, 21, 23, 27, 28):
                      continue
                  raise
              raise RuntimeError(f"System Python accepted a compromised certificate: {url}")
          print("PASS: pre-checkout system Python rejects both compromised chains")
          PY

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Verify selected Python and uv reject compromised certificates
        if: runner.os != 'Windows'
        shell: bash
        run: python scripts/check_runner_tls.py --repair-linux-trust

      - name: Download exact release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcp-zenml-release-candidate
          path: candidate

      - name: Verify unpacked bundle on target runtime
        shell: bash
        run: |
          BUNDLE_DIR="${RUNNER_TEMP}/mcp-zenml-bundle"
          mkdir -p "${BUNDLE_DIR}"
          uv run scripts/test_distributions.py inspect candidate/mcp-zenml.mcpb --extract-to "${BUNDLE_DIR}"
          uv run scripts/test_distributions.py unpacked "${BUNDLE_DIR}"

  release:
    name: Orchestrate Release
    runs-on: ubuntu-latest
    needs: [prepare-candidate, bundle-compatibility]
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      - name: Download exact tested release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcp-zenml-release-candidate
          path: candidate

      - name: Install exact tested release candidate
        run: cp candidate/{VERSION,manifest.json,server.json,pyproject.toml,mcpb-uv.lock,mcp-zenml.mcpb} .

      - name: Configure Git user and auth
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "release-bot"
          git config user.email "actions@users.noreply.github.com"
          # Re-add auth for push since persist-credentials is disabled
          git remote set-url origin "https://x-access-token:${GH_RELEASE_PAT}@github.com/${GITHUB_REPO}.git"
        env:
          GH_RELEASE_PAT: ${{ secrets.GH_RELEASE_PAT }}
          GITHUB_REPO: ${{ github.repository }}

      - name: Read version from file
        id: read_version
        run: echo "value=$(tr -d '\n\r' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Resolve version
        id: resolve_version
        run: |
          if [ -n "${INPUTS_VERSION}" ]; then
            if [ "${INPUTS_VERSION}" != "${STEPS_READ_VERSION_OUTPUTS_VALUE}" ]; then
              echo "Downloaded candidate version does not match requested version" >&2
              exit 1
            fi
            echo "value=${INPUTS_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${STEPS_READ_VERSION_OUTPUTS_VALUE}" >> "$GITHUB_OUTPUT"
          fi
        env:
          INPUTS_VERSION: ${{ inputs.version }}
          STEPS_READ_VERSION_OUTPUTS_VALUE: ${{ steps.read_version.outputs.value }}

      - name: Validate existing release tag before mutation
        if: ${{ inputs.dry_run != true }}
        env:
          STEPS_RESOLVE_VERSION_OUTPUTS_VALUE: ${{ steps.resolve_version.outputs.value }}
        run: |
          TAG="v${STEPS_RESOLVE_VERSION_OUTPUTS_VALUE}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
            if ! git diff --quiet -- VERSION manifest.json server.json pyproject.toml mcpb-uv.lock mcp-zenml.mcpb; then
              echo "Tag ${TAG} already exists but the candidate changes release files" >&2
              exit 1
            fi
            if [ "$(git rev-list -n 1 "${TAG}")" != "$(git rev-parse HEAD)" ]; then
              echo "Tag ${TAG} already points to a different commit" >&2
              exit 1
            fi
          fi

      - name: Commit and push changes
        if: ${{ inputs.dry_run != true }}
        run: |
          set -e
          git add VERSION manifest.json server.json pyproject.toml mcpb-uv.lock mcp-zenml.mcpb
          if git diff --cached --quiet; then
            echo "No release metadata changes to commit"
          else
            git commit -m "chore(release): v${STEPS_RESOLVE_VERSION_OUTPUTS_VALUE}"
          fi
          git push origin HEAD:main
        env:
          STEPS_RESOLVE_VERSION_OUTPUTS_VALUE: ${{ steps.resolve_version.outputs.value }}

      - name: Create and push annotated tag
        if: ${{ inputs.dry_run != true }}
        run: |
          set -e
          TAG="v${STEPS_RESOLVE_VERSION_OUTPUTS_VALUE}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
            if [ "$(git rev-list -n 1 "${TAG}")" != "$(git rev-parse HEAD)" ]; then
              echo "Tag ${TAG} already points to a different commit" >&2
              exit 1
            fi
          else
            git tag -a "$TAG" -m "Release $TAG"
          fi
          git push origin "$TAG"
        env:
          STEPS_RESOLVE_VERSION_OUTPUTS_VALUE: ${{ steps.resolve_version.outputs.value }}

      - name: Create/Update GitHub Release (attach MCP bundle)
        if: ${{ inputs.dry_run != true }}
        run: |
          TAG="v${VERSION}"
          PRERELEASE_FLAG=""
          if [ "${IS_PRERELEASE}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          # Create release (or upload to existing one)
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            ${PRERELEASE_FLAG} \
            mcp-zenml.mcpb 2>/dev/null || \
          gh release upload "${TAG}" mcp-zenml.mcpb --clobber
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_PAT }}
          VERSION: ${{ steps.resolve_version.outputs.value }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
