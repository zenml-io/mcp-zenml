name: Release Orchestrator

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer to release (optional). If omitted, read from VERSION"
        required: false
        type: string
      prerelease:
        description: "Mark this as a prerelease"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Validate and build without commits, tags, releases, or publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # Run tests first as a gate before releasing
  test-gate:
    name: Pre-release Tests
    runs-on: ubuntu-latest
    environment: ci
    permissions:
      contents: read
    env:
      ZENML_DISABLE_RICH_LOGGING: "1"
      ZENML_LOGGING_COLORS_DISABLED: "true"
      ZENML_ANALYTICS_OPT_IN: "false"
      PYTHONIOENCODING: "UTF-8"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: ""

      - name: Check dependency and manifest consistency
        run: |
          python scripts/check_pep723_requirements.py
          uv run scripts/generate_manifest_fields.py --check

      - name: Run credential-free MCP contract tests
        run: |
          uv run scripts/test_tool_profiles.py
          uv run scripts/test_mcp_transport.py
          uv run scripts/test_distributions.py self-test

      - name: Run authenticated MCP smoke test
        env:
          ZENML_STORE_URL: ${{ secrets.ZENML_STORE_URL }}
          ZENML_STORE_API_KEY: ${{ secrets.ZENML_STORE_API_KEY }}
          ZENML_ACTIVE_PROJECT_ID: ${{ secrets.ZENML_ACTIVE_PROJECT_ID }}
        run: |
          uv run scripts/test_mcp_server.py server/zenml_server.py --profile compact --write-policy read_write

      - name: Build and verify Docker image
        run: |
          docker build -t mcp-zenml:test .
          uv run scripts/test_distributions.py docker mcp-zenml:test

      - name: Build and verify MCP bundle
        run: uv run scripts/test_distributions.py reproducible mcp-zenml.mcpb

  live-integration:
    name: Disposable OSS ZenML integration receipt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ZENML_DISABLE_RICH_LOGGING: "1"
      ZENML_LOGGING_COLORS_DISABLED: "true"
      ZENML_ANALYTICS_OPT_IN: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Run disposable OSS integration receipt
        run: bash scripts/run_disposable_resource_integration.sh

  prepare-candidate:
    name: Prepare release candidate
    runs-on: ubuntu-latest
    needs: [test-gate, live-integration]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: ""

      - name: Apply candidate version and build bundle
        env:
          INPUTS_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${INPUTS_VERSION}" ]; then
            python scripts/bump_version.py --version "${INPUTS_VERSION}"
          else
            python scripts/bump_version.py
          fi
          python scripts/generate_manifest_fields.py
          bash scripts/build_mcpb.sh
          BUNDLE_DIR="${RUNNER_TEMP}/mcp-zenml-release-bundle"
          mkdir -p "${BUNDLE_DIR}"
          uv run scripts/test_distributions.py inspect mcp-zenml.mcpb --extract-to "${BUNDLE_DIR}"
          uv run scripts/test_distributions.py unpacked "${BUNDLE_DIR}"

      - name: Upload exact release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-zenml-release-candidate
          path: |
            VERSION
            manifest.json
            server.json
            pyproject.toml
            mcpb-uv.lock
            mcp-zenml.mcpb
          if-no-files-found: error
          retention-days: 7

  bundle-compatibility:
    name: MCPB (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    needs: prepare-candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
      ZENML_MCP_ANALYTICS_ENABLED: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Download exact release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mcp-zenml-release-candidate
          path: candidate

      - name: Verify unpacked bundle on target runtime
        shell: bash
        run: |
          BUNDLE_DIR="${RUNNER_TEMP}/mcp-zenml-bundle"
          mkdir -p "${BUNDLE_DIR}"
          uv run scripts/test_distributions.py inspect candidate/mcp-zenml.mcpb --extract-to "${BUNDLE_DIR}"
          uv run scripts/test_distributions.py unpacked "${BUNDLE_DIR}"

  release:
    name: Orchestrate Release
    runs-on: ubuntu-latest
    needs: [prepare-candidate, bundle-compatibility]
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout repository (with PAT)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GH_RELEASE_PAT }}
          persist-credentials: false


      - name: Download exact tested release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mcp-zenml-release-candidate
          path: candidate

      - name: Install exact tested release candidate
        run: cp candidate/{VERSION,manifest.json,server.json,pyproject.toml,mcpb-uv.lock,mcp-zenml.mcpb} .

      - name: Configure Git user and auth
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "release-bot"
          git config user.email "actions@users.noreply.github.com"
          # Re-add auth for push since persist-credentials is disabled
          git remote set-url origin "https://x-access-token:${GH_RELEASE_PAT}@github.com/${GITHUB_REPO}.git"
        env:
          GH_RELEASE_PAT: ${{ secrets.GH_RELEASE_PAT }}
          GITHUB_REPO: ${{ github.repository }}

      - name: Read version from file
        id: read_version
        run: echo "value=$(tr -d '\n\r' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Resolve version
        id: resolve_version
        run: |
          if [ -n "${INPUTS_VERSION}" ]; then
            if [ "${INPUTS_VERSION}" != "${STEPS_READ_VERSION_OUTPUTS_VALUE}" ]; then
              echo "Downloaded candidate version does not match requested version" >&2
              exit 1
            fi
            echo "value=${INPUTS_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${STEPS_READ_VERSION_OUTPUTS_VALUE}" >> "$GITHUB_OUTPUT"
          fi
        env:
          INPUTS_VERSION: ${{ inputs.version }}
          STEPS_READ_VERSION_OUTPUTS_VALUE: ${{ steps.read_version.outputs.value }}

      - name: Validate existing release tag before mutation
        if: ${{ inputs.dry_run != true }}
        env:
          STEPS_RESOLVE_VERSION_OUTPUTS_VALUE: ${{ steps.resolve_version.outputs.value }}
        run: |
          TAG="v${STEPS_RESOLVE_VERSION_OUTPUTS_VALUE}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
            if ! git diff --quiet -- VERSION manifest.json server.json pyproject.toml mcpb-uv.lock mcp-zenml.mcpb; then
              echo "Tag ${TAG} already exists but the candidate changes release files" >&2
              exit 1
            fi
            if [ "$(git rev-list -n 1 "${TAG}")" != "$(git rev-parse HEAD)" ]; then
              echo "Tag ${TAG} already points to a different commit" >&2
              exit 1
            fi
          fi

      - name: Commit and push changes
        if: ${{ inputs.dry_run != true }}
        run: |
          set -e
          git add VERSION manifest.json server.json pyproject.toml mcpb-uv.lock mcp-zenml.mcpb
          if git diff --cached --quiet; then
            echo "No release metadata changes to commit"
          else
            git commit -m "chore(release): v${STEPS_RESOLVE_VERSION_OUTPUTS_VALUE}"
          fi
          git push origin HEAD:main
        env:
          STEPS_RESOLVE_VERSION_OUTPUTS_VALUE: ${{ steps.resolve_version.outputs.value }}

      - name: Create and push annotated tag
        if: ${{ inputs.dry_run != true }}
        run: |
          set -e
          TAG="v${STEPS_RESOLVE_VERSION_OUTPUTS_VALUE}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
            if [ "$(git rev-list -n 1 "${TAG}")" != "$(git rev-parse HEAD)" ]; then
              echo "Tag ${TAG} already points to a different commit" >&2
              exit 1
            fi
          else
            git tag -a "$TAG" -m "Release $TAG"
          fi
          git push origin "$TAG"
        env:
          STEPS_RESOLVE_VERSION_OUTPUTS_VALUE: ${{ steps.resolve_version.outputs.value }}

      - name: Create/Update GitHub Release (attach MCP bundle)
        if: ${{ inputs.dry_run != true }}
        run: |
          TAG="v${VERSION}"
          PRERELEASE_FLAG=""
          if [ "${IS_PRERELEASE}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          # Create release (or upload to existing one)
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            ${PRERELEASE_FLAG} \
            mcp-zenml.mcpb 2>/dev/null || \
          gh release upload "${TAG}" mcp-zenml.mcpb --clobber
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_PAT }}
          VERSION: ${{ steps.resolve_version.outputs.value }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
